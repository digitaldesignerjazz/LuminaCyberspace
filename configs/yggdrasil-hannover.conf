# Yggdrasil — Hannover Hub (LuminaCyberspace / Nexus)
# Topology: hub-and-spoke. Hannover alone carries public uplinks.
# Sisters (Lumia, Lyra, Xen, Elara) are leaves — LAN multicast only.
# PrivateKey is NOT touched here; the live key on the node is preserved.

Peers: [
  # Nürnberg — Marek Küthe / mk16.de, key-pinned, TLS, max backoff 20s
  "tls://ygg1.mk16.de:1338?key=0000000087ee9949eeab56bd430ee8f324cad55abf3993ed9b9be63ce693e18a&maxbackoff=20s"
  "tls://ygg2.mk16.de:1338?key=000000d80a2d7b3126ea65c8c08fc751088c491a5cdd47eff11c86fa1e4644ae&maxbackoff=20s"
  # QUIC same hosts — commented, not parallel-active:
  # "quic://ygg1.mk16.de:1339?key=0000000087ee9949eeab56bd430ee8f324cad55abf3993ed9b9be63ce693e18a&maxbackoff=20s"
  # "quic://ygg2.mk16.de:1339?key=000000d80a2d7b3126ea65c8c08fc751088c491a5cdd47eff11c86fa1e4644ae&maxbackoff=20s"
]

InterfacePeers: {}

# Empty = no public relay. Only open for a remote leaf:
#   Listen: [ "tls://[::]:54321" ]
Listen: []

AdminListen: "unix:///var/run/yggdrasil/yggdrasil.sock"

MulticastInterfaces: [
  {
    # Ethernet first, WLAN second; skip docker/bridges/ygg0
    Regex: "^(eth|en|ens|eno|em)[0-9a-z]+$"
    Beacon: true
    Listen: true
    Port: 0
    Priority: 1
    Password: "nexus-hannover-overlay"
  }
  {
    Regex: "^(wlan|wl)[0-9a-z]+$"
    Beacon: true
    Listen: true
    Port: 0
    Priority: 2
    Password: "nexus-hannover-overlay"
  }
  {
    Regex: "^(docker|br|veth|virbr|ygg)[0-9a-z]*$"
    Beacon: false
    Listen: false
    Port: 0
    Priority: 0
    Password: ""
  }
]

# Whitelist — fill with the four sisters' public keys, then re-apply.
# Lumia:
# Lyra:
# Xen:
# Elara:
AllowedPublicKeys: []

IfName: "ygg0"
IfMTU: 65535

NodeInfoPrivacy: false

NodeInfo: {
  name: "Hannover"
  role: "hub"
  swarm: "Lumia, Lyra, Xen, Elara"
  status: "Nexus Mesh Hub — Hannover / Esslinger & Co."
}
