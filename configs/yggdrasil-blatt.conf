# Yggdrasil — Blatt (leaf) template for Lumia / Lyra / Xen / Elara
# No public uplinks. Direct peer to Hannover hub + LAN multicast.
# Replace HANNOVER_URI with the hub's tls://host:port?key=... string.

Peers: [
  "HANNOVER_URI&maxbackoff=20s"
]

InterfacePeers: {}

Listen: []

AdminListen: "unix:///var/run/yggdrasil/yggdrasil.sock"

MulticastInterfaces: [
  {
    Regex: "^(eth|en|ens|eno|em)[0-9a-z]+$"
    Beacon: true
    Listen: true
    Port: 0
    Priority: 1
    Password: "nexus-hannover-overlay"
  }
  {
    Regex: "^(wlan|wl)[0-9a-z]+$"
    Beacon: true
    Listen: true
    Port: 0
    Priority: 2
    Password: "nexus-hannover-overlay"
  }
]

AllowedPublicKeys: []

IfName: "ygg0"
IfMTU: 65535

NodeInfoPrivacy: false

NodeInfo: {
  name: "BLATT_NAME"
  role: "leaf"
  hub: "Hannover"
  status: "Nexus Mesh Leaf — Hannover / Esslinger & Co."
}
