name: Publish container package (GHCR)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image version tag (e.g. 1.0.0-alpha)"
        required: true
        default: "1.0.0-alpha"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: digitaldesignerjazz/lumina-cyberspace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="${{ inputs.tag }}"
          fi
          V="${V#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${V}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=alpha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          # Explicit labels (no auto repo-description / empty licenses label).
          labels: |
            org.opencontainers.image.source=https://github.com/digitaldesignerjazz/LuminaCyberspace
            org.opencontainers.image.url=https://github.com/digitaldesignerjazz/LuminaCyberspace
            org.opencontainers.image.title=Lumina Cyberspace
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Lumina Cyberspace Alpha 1.0 – öffentlicher Snapshot des Lumina/Nexus-Stacks mit Yggdrasil 0.5.14 (ohne Secrets) / public secret-free snapshot of the Lumina/Nexus stack with Yggdrasil 0.5.14
