name: Publish container package (GHCR)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.0.0-alpha.1"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.0.0-alpha.2"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: digitaldesignerjazz/lumina-cyberspace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version and channel
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # workflow_dispatch / workflow_call provide inputs.tag; release event provides the release tag
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then echo "::error::no tag given"; exit 1; fi
          V="${TAG#v}"
          TAG="v${V}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG' does not match vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"; exit 1
          fi
          if [[ "$V" == *-* ]]; then
            PRE="${V#*-}"          # e.g. alpha.3
            CHANNEL="${PRE%%.*}"   # e.g. alpha
          else
            CHANNEL="latest"       # stable release
          fi
          {
            echo "tag=${TAG}"
            echo "version=${V}"
            echo "channel=${CHANNEL}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} as version ${V} (+ channel tag '${CHANNEL}')"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.ver.outputs.tag }}

      - name: Resolve revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.channel }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          # Explicit labels (no auto repo-description / empty licenses label).
          labels: |
            org.opencontainers.image.source=https://github.com/digitaldesignerjazz/LuminaCyberspace
            org.opencontainers.image.url=https://github.com/digitaldesignerjazz/LuminaCyberspace
            org.opencontainers.image.title=Lumina Cyberspace
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.description=Lumina Cyberspace ${{ steps.ver.outputs.version }} – öffentlicher Snapshot des Lumina/Nexus-Stacks mit Yggdrasil 0.5.14 (ohne Secrets) / public secret-free snapshot of the Lumina/Nexus stack with Yggdrasil 0.5.14
