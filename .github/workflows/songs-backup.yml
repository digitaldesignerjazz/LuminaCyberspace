name: Songs Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  backup:
    runs-on: self-hosted
    steps:
      - name: Verify song backups exist
        run: |
          test -f songs/cyberspace.md
          test -f songs/aura.md
          echo "Cyberspace and Aura backups present."
      - name: Mirror to nexus-ecosystem-audio
        run: echo "Mirror handled by Lumia on dispatch."
