name: Songs Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  backup:
    runs-on: self-hosted
    steps:
      # Without a checkout the self-hosted workspace is empty and the
      # test -f checks below fail even though the files are on main.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: songs

      - name: Verify song backups exist
        run: |
          test -f songs/cyberspace.md
          test -f songs/aura.md
          echo "Cyberspace and Aura backups present."
      - name: Mirror to nexus-ecosystem-audio
        run: echo "Mirror handled by Lumia on dispatch."
