name: nexus-overlay-apply-hannover
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'  # 00:30 Europe/Berlin

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - name: Checkout LuminaCyberspace
        uses: actions/checkout@v4

      - name: Backup, apply config, restart daemon
        run: sudo bash scripts/configure-overlay.sh configs/yggdrasil-hannover.conf

      - name: Status report
        run: |
          echo "=== getSelf ==="
          yggdrasilctl getSelf || true
          echo "=== getPeers sort=cost ==="
          yggdrasilctl getPeers sort=cost || true
          echo "=== getTree ==="
          yggdrasilctl getTree || true
          echo "=== daemon status ==="
          systemctl is-active yggdrasil || true
          echo "=== latest backup ==="
          ls -1t /etc/yggdrasil/yggdrasil.conf.bak.* 2>/dev/null | head -1 || echo "no backup"
