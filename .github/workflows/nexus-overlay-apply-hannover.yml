name: nexus-overlay-apply-hannover

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  apply:
    runs-on: ${{ vars.HANNOVER_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Hannover overlay (no-op on hosted)
        run: |
          echo "HANNOVER_RUNNER=${{ vars.HANNOVER_RUNNER }}"
          echo "Auf ubuntu-latest: kein Yggdrasil, kein Daemon — nur Status-Report."
          echo "Sobald der Self-Hosted-Runner 'hannover-primary' online ist, greift er automatisch."

      - name: Status report
        run: |
          echo "## Hannover Overlay Status"
          echo "Runner: ${{ runner.name }}"
          echo "Labels: ${{ runner.labels }}"
          echo "Hinweis: echter Overlay-Apply nur auf dem Hannover-Knoten."
