{
  # yggdrasil-blatt.conf
  # Lokales Blatt (Lumia / Lyra / Xen / Elara).
  # yggdrasil -genconf, PrivateKey übernehmen, Rest aus dieser Datei.
  # Kein Public-Peer. Kein Listen nach außen. Nur LAN-Multicast.

  PrivateKey: <PASTE-FROM-GENCONF>

  Peers: []
  InterfacePeers: {}
  Listen: []

  AdminListen: "tcp://127.0.0.1:<ADMINPORT>"

  MulticastInterfaces: [
    {
      Regex: "eth.*|enp.*|eno.*"
      Beacon: true
      Listen: true
      Port: 0
      Priority: 1
      Password: "<REDACTED>"
    }
    {
      Regex: "wlan.*|wl.*|wlp.*"
      Beacon: true
      Listen: true
      Port: 0
      Priority: 2
      Password: "<REDACTED>"
    }
  ]

  AllowedPublicKeys: [
    "dc1118b0ea1bb2c332de02efc7c35400a0c29dd823bc16d59e64269c89ddaff9"
    # plus the other three Blatt pubkeys from roster.json
  ]

  IfName: "<tunN>"
  IfMTU: 65535
  NodeInfoPrivacy: false
  NodeInfo: {
    name: "<BlattName>"
    role: "blatt"
    hub: "Hannover"
    site: "Hannover / Esslinger & Co."
  }
}
