{
  # Hannover-Node — Overlay Lumia / Lyra / Xen / Elara
  # PrivateKey NICHT ersetzen, den bestehenden Schlüssel dieses Nodes behalten.
  # Erzeugen nur auf einem frischen Node: yggdrasil -genconf
  # PrivateKey: <BESTEHENDEN SCHLÜSSEL STEHEN LASSEN>

  Peers: [
    # Zwei nahe DE-Uplinks (Nürnberg). Mehr öffentliche Peers = mehr Transit auf der Heimleitung.
    "tls://ygg1.mk16.de:1338?key=0000000087ee9949eeab56bd430ee8f324cad55abf3993ed9b9be63ce693e18a"
    "tls://ygg2.mk16.de:1338?key=000000d80a2d7b3126ea65c8c08fc751088c491a5cdd47eff11c86fa1e4644ae"

    # Eigene Overlay-Nodes hier einsetzen, sobald Host:Port feststehen:
    # "tls://<LYRA-HOST>:<PORT>?key=<LYRA-PUBKEY>"
    # "tls://<XEN-HOST>:<PORT>?key=<XEN-PUBKEY>"
    # "tls://<LUMIA-HOST>:<PORT>?key=<LUMIA-PUBKEY>"
    # "tls://<ELARA-HOST>:<PORT>?key=<ELARA-PUBKEY>"
  ]

  InterfacePeers: {}

  # Kein öffentliches Listen auf dem Hannover-Heimknoten.
  # Eingehende Peerings nur über Multicast im LAN oder über Outbound zu den Uplinks.
  Listen: []

  AdminListen: "unix:///var/run/yggdrasil/yggdrasil.sock"

  MulticastInterfaces: [
    {
      Regex: "eth.*|enp.*|eno.*"
      Beacon: true
      Listen: true
      Port: 0
      Priority: 1
      Password: ""
    }
    {
      Regex: "wlan.*|wl.*|wlp.*"
      Beacon: true
      Listen: true
      Port: 0
      Priority: 2
      Password: ""
    }
  ]

  # PublicKeys der Schwestern hier eintragen. Leer = jeder darf eingehend peeren.
  AllowedPublicKeys: [
    # "<LUMIA-PUBKEY>"
    # "<LYRA-PUBKEY>"
    # "<XEN-PUBKEY>"
    # "<ELARA-PUBKEY>"
  ]

  IfName: "ygg0"
  IfMTU: 65535

  NodeInfoPrivacy: false
  NodeInfo: {
    name: "Hannover"
    role: "home-uplink"
    swarm: "Lumia-Lyra-Xen-Elara"
    site: "Hannover / Esslinger & Co."
  }
}
